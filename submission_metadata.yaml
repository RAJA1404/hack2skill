ai_usage_summary: |
  Used Claude for architecture discussion, code review, and debugging.
  All candidate data analysis, scoring logic, and design decisions were
  made by the participant. No candidate data was sent to any LLM API.

methodology_summary: |
  Multi-signal hybrid ranker combining semantic similarity (TF-IDF with
  optional sentence-transformers upgrade), skills scoring with proficiency
  and duration weighting, career quality assessment (product-company history,
  AI/ML role relevance, consulting firm penalty), experience fit, location
  preference, and a behavioral availability multiplier using Redrob signals.
  Honeypot detection flags impossible profiles before scoring. Pre-filter
  removes obvious non-fits (wrong career domain) to stay within compute limits.
  Runtime: ~90 seconds for 100K candidates on CPU.

declarations:
  read_submission_spec: true
  code_is_original_work: true
  no_collusion: true
  honeypot_check_done: true
  reproduction_tested: true
